version: 1
name: GOVERDOCS Documentation Decision Matrix
default_action: no-op
default_write_mode: draft
rules:
- id: DOC-EVT-001
  event: project_created
  description: Vznik nového projektu
  detection:
    any:
    - changed_paths:
      - README.md
      - pyproject.toml
      - .goverdocs.yaml
    - labels:
      - project-created
    - semantic_signals:
      - vznik nového projektu
  severity: high
  priority: 90
  actions:
  - document_type: project-state
    action: create
    target: PROJECT_STATE.md
    write_policy: automatic
  - document_type: documentation-index
    action: create
    target: DOCUMENTATION_INDEX.md
    write_policy: generated
  - document_type: current-context
    action: create
    target: project-memory/CURRENT_CONTEXT.md
    write_policy: automatic
  - document_type: session-log
    action: append
    target: project-memory/SESSION_LOG.md
    write_policy: append-only
  required_evidence:
  - source reference
  - change rationale
  - affected scope
  validations:
  - metadata-schema
  - unique-id
  - relationship-integrity
  - link-check
  - duplicate-detection
  - approval-state
  approval:
    required: false
    roles: []
  rollback:
    strategy: revert-draft-or-restore-receipt
    preserve_audit_log: true
  on_failure:
    action: block-write
    create_report: true
    open_question: true
- id: DOC-EVT-002
  event: project_state_changed
  description: Změna aktuálního stavu projektu
  detection:
