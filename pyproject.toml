[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goverdocs"
version = "0.1.0"
description = "Deterministic documentation governance kernel for human and AI-operated projects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0.12",
]
release = [
  "build==1.5.0",
  "twine==6.2.0",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
]
compliance = [
  "reuse[charset-normalizer]==6.2.0",
]

[project.urls]
Homepage = "https://github.com/cyberDJs/Goverdocs"
Repository = "https://github.com/cyberDJs/Goverdocs"
Issues = "https://github.com/cyberDJs/Goverdocs/issues"

[project.scripts]
goverdocs = "goverdocs.cli:main"
goverdocs-github-observe = "goverdocs.github_observe_cli:main"
goverdocs-github-changeset = "goverdocs.github_changeset_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goverdocs = ["resources/*", "resources/templates/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["goverdocs"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
