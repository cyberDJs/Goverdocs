name: r11-governance-dispatch-kick

on:
  pull_request:
    types: [reopened, synchronize]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-governance:
    name: dispatch canonical governance reevaluation
    if: >-
      github.repository == 'nulleimy/OATHDO' &&
      github.event.pull_request.number == 44 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'proof/r11-positive-author-kick' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.title == 'chore(governance): kick R11 neutral proof author'
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch canonical governance gate for PR 50
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run governance-gate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pull_request=50
          echo "DISPATCHED_GOVERNANCE_PR=50"

      - name: Observe dispatched governance gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            row="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow governance-gate.yml \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId,status,conclusion,headSha,createdAt \
              --jq '.[0] | [.databaseId,.status,(.conclusion // ""),.headSha,.createdAt] | @tsv')"
            echo "GOVERNANCE_DISPATCH_OBSERVED=$row"
            run_id="$(printf '%s' "$row" | cut -f1)"
            status="$(printf '%s' "$row" | cut -f2)"
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log
              exit 0
            fi
            sleep 2
          done
          echo "governance dispatch did not complete in observation window" >&2
          exit 2
