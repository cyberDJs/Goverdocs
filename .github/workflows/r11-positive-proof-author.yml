name: r11-positive-proof-author

on:
  workflow_run:
    workflows: [quality]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: r11-positive-proof-author
  cancel-in-progress: false

jobs:
  author-proof:
    name: author neutral R11 critical proof
    if: >-
      github.repository_owner == 'nulleimy' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validate bounded kick PR
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          expected_branch='proof/r11-positive-author-kick'
          expected_title='chore(governance): kick R11 neutral proof author'

          mapfile -t prs < <(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$expected_branch" \
            --json number \
            --jq '.[].number')

          if [ "${#prs[@]}" -ne 1 ]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo "R11_KICK_PR_COUNT=${#prs[@]}"
            exit 0
          fi

          pr="${prs[0]}"
          payload="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"

          title="$(jq -r '.title' <<<"$payload")"
          state="$(jq -r '.state' <<<"$payload")"
          base="$(jq -r '.base.ref' <<<"$payload")"
          head="$(jq -r '.head.ref' <<<"$payload")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$payload")"
          head_sha="$(jq -r '.head.sha' <<<"$payload")"

          if [ "$state" != 'open' ] || \
             [ "$title" != "$expected_title" ] || \
             [ "$base" != 'main' ] || \
             [ "$head" != "$expected_branch" ] || \
             [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo "R11_KICK_REJECTED pr=$pr state=$state base=$base head=$head head_repo=$head_repo"
            exit 0
          fi

          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "R11_KICK_ACCEPTED pr=$pr head=$head_sha"

      - name: Publish pending harness status
        if: steps.validate.outputs.eligible == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f context='R11 Proof Author Harness' \
            -f description='neutral proof author running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout canonical default branch
        if: steps.validate.outputs.eligible == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create bot-authored critical proof PR
        if: steps.validate.outputs.eligible == 'true'
        id: author
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch='proof/r11-positive-live-quorum'
          proof='docs/governance/R11-POSITIVE-LIVE-QUORUM-PROOF.md'

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "R11_PROOF_PR_ALREADY_OPEN=$existing_pr"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "R11_PROOF_BRANCH_ALREADY_EXISTS_WITHOUT_OPEN_PR=$branch" >&2
            exit 2
          fi

          git switch -c "$branch"

          cat > "$proof" <<'EOF'
          ---
          id: GOV-0010
          type: governance
          title: R11 Positive Live Quorum Proof
          status: active
          owner: OATHDO
          created: 2026-08-18
          updated: 2026-08-18
          version: 1.0.0
          canonical: true
          managed_by: mixed
          write_policy: approval-required
          supersedes: null
          superseded_by: null
          related:
            - GOV-0005
            - GOV-0008
          source_refs:
            - GH-ISSUE-35
          last_verified: null
          review_due: null
          ---

          # OATHDO R11 — Positive Live Quorum Proof

          This document exists only to create the final live `governance_change` / critical obligation for R11 verification.

          The proof succeeds only when the pull request is authored by a neutral non-authority GitHub actor, `nulleimy` supplies a VERIFIED exact-head `project-owner` approval, `setarchitect` supplies a VERIFIED exact-head `independent-reviewer` approval, the required `GOVERDOCS Governance Gate` becomes non-blocking for the critical obligation, and GitHub accepts the exact-head merge server-side.

          The proof must not weaken the authority policy, ruleset, required check, exact-head semantics, revocation semantics, or anti-self-approval rule.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$proof"
          git commit -m 'test(governance): prove R11 positive live quorum'
          git push origin "HEAD:refs/heads/$branch"

          head_sha="$(git rev-parse HEAD)"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title 'test(governance): prove R11 positive live quorum' \
            --body "## Purpose

Final OATHDO R11 positive live quorum acceptance probe for #35.

## Exact subject

- head: \`$head_sha\`
- author must remain the neutral GitHub Actions actor
- critical event: \`governance_change\`

## Required authority

- \`nulleimy\` → \`project-owner\` exact-head approval
- \`setarchitect\` → \`independent-reviewer\` exact-head approval
- both must be distinct non-author actors

@setarchitect: submit the exact independent-reviewer marker supplied by the project owner. Do not alter the PR head.

## Acceptance

1. R10 exact-subject verification accepts both current-head markers.
2. R11 observes two distinct eligible actors and two distinct roles.
3. Required critical capabilities are satisfied.
4. \`GOVERDOCS Governance Gate\` becomes non-blocking for the critical obligation.
5. GitHub accepts exact-head merge server-side.
6. No ruleset or policy weakening occurs.

Tracks #35."

          echo "R11_PROOF_HEAD=$head_sha"

      - name: Publish final harness status
        if: steps.validate.outputs.eligible == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR_OUTCOME: ${{ steps.author.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          state='success'
          description='neutral proof PR created or already open'
          if [ "$AUTHOR_OUTCOME" != 'success' ]; then
            state='failure'
            description="neutral proof author failed: $AUTHOR_OUTCOME"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='R11 Proof Author Harness' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ "$state" = 'failure' ]; then
            exit 1
          fi
