name: r12-post-merge-verification

on:
  pull_request:
    types: [reopened, synchronize]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  verify-post-merge:
    name: verify R12.1 post-merge canonical state
    if: >-
      github.repository == 'nulleimy/OATHDO' &&
      github.event.pull_request.number == 44 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'proof/r11-positive-author-kick' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact merge SHA checks and workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: 453ee7f835d422fbc2d5e8c36252d60617006485
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          echo "CURRENT_MAIN=$current_main"
          test "$current_main" = "$MERGE_SHA"

          echo '=== POST-MERGE CHECK RUNS ==='
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/check-runs" \
            --jq '.check_runs[] | {id,name,status,conclusion,head_sha,app_id:.app.id,app_slug:.app.slug}'

          echo '=== POST-MERGE WORKFLOW RUNS ==='
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f head_sha="$MERGE_SHA" \
            -f per_page=100 \
            --jq '.workflow_runs[] | {id,name,event,status,conclusion,head_sha}'
