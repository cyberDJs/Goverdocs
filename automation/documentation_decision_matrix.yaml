    target: project-memory/SESSION_LOG.md
    write_policy: append-only
  required_evidence:
  - source reference
  - change rationale
  - affected scope
  validations:
  - metadata-schema
  - unique-id
  - relationship-integrity
  - link-check
  - duplicate-detection
  - approval-state
  approval:
    required: false
    roles: []
  rollback:
    strategy: revert-draft-or-restore-receipt
    preserve_audit_log: true
  on_failure:
    action: block-write
    create_report: true
    open_question: true
