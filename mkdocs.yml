site_name: GOVERDOCS
site_description: Deterministická governance technické dokumentace
site_url: https://nulleimy.github.io/Goverdocs/
repo_url: https://github.com/nulleimy/Goverdocs
repo_name: nulleimy/Goverdocs
edit_uri: edit/main/site-docs/
docs_dir: site-docs
site_dir: site
strict: true

theme:
  name: material
  language: cs
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Přehled: index.md
  - Začínáme: getting-started.md
  - Governance model: governance-model.md
  - Kanonická dokumentace:
      - Technická ústava: https://github.com/nulleimy/Goverdocs/blob/main/WORLD_CLASS_SOFTWARE_DEVOPS_OPERATING_MODE.md
      - Dokumentační index: https://github.com/nulleimy/Goverdocs/blob/main/DOCUMENTATION_INDEX.md
      - Projektový stav: https://github.com/nulleimy/Goverdocs/blob/main/PROJECT_STATE.md
      - Automatizační governance: https://github.com/nulleimy/Goverdocs/blob/main/docs/governance/GOV-DOCUMENTATION-AUTOMATION.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
