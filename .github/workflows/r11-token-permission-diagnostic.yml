name: r12-immutable-identity-gate-diagnostic

on:
  pull_request:
    types: [reopened, synchronize]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  inspect-gate:
    name: inspect R12 immutable identity gate
    if: >-
      github.repository == 'nulleimy/OATHDO' &&
      github.event.pull_request.number == 44 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'proof/r11-positive-author-kick' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact R12.1 proof gate and producer run
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_SHA: 89cf1fdce6eafbfd2e37985db8ab0cf01bb4a3e9
        shell: bash
        run: |
          set -euo pipefail
          echo "PROOF_SHA=$PROOF_SHA"

          checks="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$PROOF_SHA/check-runs")"

          echo '=== GOVERNANCE CHECK ==='
          jq -c '.check_runs[] | select(.name == "GOVERDOCS Governance Gate") | {id,name,status,conclusion,head_sha,details_url,output,app:{id:.app.id,slug:.app.slug}}' <<<"$checks"

          details_url="$(jq -r '.check_runs[] | select(.name == "GOVERDOCS Governance Gate") | .details_url // empty' <<<"$checks" | tail -n 1)"
          test -n "$details_url"
          run_id="$(sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' <<<"$details_url")"
          echo "GOVERNANCE_RUN_ID=$run_id"
          test -n "$run_id"

          echo '=== GOVERNANCE RUN ==='
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json name,event,status,conclusion,headSha,url

          echo '=== GOVERNANCE RUN LOG ==='
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log
