name: r11-governance-dispatch-kick

on:
  pull_request:
    types: [reopened, synchronize]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  dispatch-governance:
    name: dispatch canonical governance reevaluation
    if: >-
      github.repository == 'nulleimy/OATHDO' &&
      github.event.pull_request.number == 44 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'proof/r11-positive-author-kick' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.title == 'chore(governance): kick R11 neutral proof author'
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch canonical governance gate for PR 50
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run governance-gate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pull_request=50)"
          run_id="${run_url##*/}"
          case "$run_id" in
            ''|*[!0-9]*)
              echo "invalid dispatch run id from url: $run_url" >&2
              exit 2
              ;;
          esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "DISPATCHED_GOVERNANCE_PR=50"
          echo "DISPATCHED_RUN_ID=$run_id"

      - name: Observe exact dispatched governance gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status || rc=$?
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log
          echo "DISPATCH_RUN_RC=${rc:-0}"

      - name: Inspect exact proof check runs and ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/50" --jq '.head.sha')"
          echo "PROOF_HEAD=$head_sha"
          echo "=== CHECK RUNS ==="
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs" \
            --jq '.check_runs[] | {id,name,status,conclusion,head_sha,external_id,app_id:.app.id,app_slug:.app.slug}'
          echo "=== RULESET 20928616 ==="
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/rulesets/20928616" \
            --jq '{id,name,enforcement,rules}'
