name: r11-bootstrap-diagnostic

on:
  push:
    branches:
      - feat/r11-governance-authority

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pre-R11 canonical base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: a906fa7c12ae90f6dcd0d4a8c8d6c92a7f03611b
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-R11 canonical GOVERDOCS
        run: python -m pip install --disable-pip-version-check -e .

      - name: Capture canonical evaluator result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          goverdocs-github-run \
            --root . \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request 36 \
            --as-of 2026-08-17 \
            --verified-at 2026-08-17T23:59:59Z \
            --role-binding "nulleimy=project-owner" \
            --trust-github-verifier \
            --trust-pr-evidence-contract \
            --trust-project-owner-comment-approval \
            > /tmp/r11-out.json 2> /tmp/r11-err.txt
          rc=$?
          set -e
          python - "$rc" <<'PY'
          import base64
          from pathlib import Path
          import sys

          rc = sys.argv[1]
          stdout = Path('/tmp/r11-out.json').read_bytes()[:12000]
          stderr = Path('/tmp/r11-err.txt').read_bytes()[:12000]
          out = base64.b64encode(stdout).decode('ascii')
          err = base64.b64encode(stderr).decode('ascii')
          print(f"::error file=.github/workflows/r11-bootstrap-diagnostic.yml,line=1::R11_DIAG_RC={rc};STDOUT_B64={out};STDERR_B64={err}")
          PY
          exit 1
