name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest

      - name: Documentation validation
        run: goverdocs validate --root .

      - name: Documentation health
        run: goverdocs health --root .

  governance-toolchain:
    name: governance toolchain
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation and compliance tooling
        run: python -m pip install --disable-pip-version-check -e '.[docs,compliance]'

      - name: Build documentation portal
        run: mkdocs build --strict

      - name: Verify REUSE compliance
        run: reuse lint

      - name: Upload documentation portal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goverdocs-site-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 14

  package:
    name: package / sdist + wheel
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned release tooling
        run: python -m pip install --disable-pip-version-check 'build==1.5.0' 'twine==6.2.0'

      - name: Set reproducible build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build distributions twice
        shell: bash
        run: |
          set -euo pipefail
          python -m build --outdir dist-a
          python -m build --outdir dist-b

      - name: Compare raw sdist payloads
        run: >-
          python scripts/verify_distribution.py compare-sdist-payload
          --left dist-a/goverdocs-0.1.0.tar.gz
          --right dist-b/goverdocs-0.1.0.tar.gz

      - name: Canonicalize source archives
        shell: bash
        run: |
          set -euo pipefail
          sdists=(
            dist-a/goverdocs-0.1.0.tar.gz
            dist-b/goverdocs-0.1.0.tar.gz
          )
          for sdist in "${sdists[@]}"; do
            python scripts/verify_distribution.py canonicalize-sdist \
              --path "$sdist" \
              --epoch "$SOURCE_DATE_EPOCH"
          done

      - name: Verify reproducible build output
        run: >-
          python scripts/verify_distribution.py compare
          --left dist-a
          --right dist-b

      - name: Select verified distributions
        shell: bash
        run: |
          set -euo pipefail
          mv dist-a dist
          rm -rf dist-b

      - name: Check package metadata and README rendering
        run: python -m twine check --strict dist/*

      - name: Verify distribution contents and metadata
        run: >-
          python scripts/verify_distribution.py artifacts
          --dist-dir dist
          --manifest dist/ARTIFACT_MANIFEST.json

      - name: Clean-install and dependency audit
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/goverdocs-smoke"
          python -m venv "$smoke"
          "$smoke/bin/python" -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            dist/*.whl
          test "$("$smoke/bin/goverdocs" --version)" = 'goverdocs 0.1.0'
          "$smoke/bin/goverdocs" health --root .
          "$smoke/bin/python" -m pip check
          "$smoke/bin/python" scripts/verify_distribution.py environment \
            --output dist/RUNTIME_DEPENDENCIES.json

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goverdocs-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  r11-neutral-author:
    name: R11 neutral proof author
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 44 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'proof/r11-positive-author-kick' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.title == 'chore(governance): kick R11 neutral proof author'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout canonical main only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Create neutral bot-authored proof PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch='proof/r11-positive-live-quorum'
          proof='docs/governance/R11-POSITIVE-LIVE-QUORUM-PROOF.md'

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "R11_PROOF_PR_ALREADY_OPEN=$existing_pr"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "R11_PROOF_BRANCH_ALREADY_EXISTS_WITHOUT_OPEN_PR=$branch" >&2
            exit 2
          fi

          git switch -c "$branch"

          cat > "$proof" <<'EOF'
          ---
          id: GOV-0010
          type: governance
          title: R11 Positive Live Quorum Proof
          status: active
          owner: OATHDO
          created: 2026-08-18
          updated: 2026-08-18
          version: 1.0.0
          canonical: true
          managed_by: mixed
          write_policy: approval-required
          supersedes: null
          superseded_by: null
          related:
            - GOV-0005
            - GOV-0008
          source_refs:
            - GH-ISSUE-35
          last_verified: null
          review_due: null
          ---

          # OATHDO R11 — Positive Live Quorum Proof

          This document exists only to create the final live `governance_change` / critical obligation for R11 verification.

          The proof succeeds only when the pull request is authored by a neutral non-authority GitHub actor, `nulleimy` supplies a VERIFIED exact-head `project-owner` approval, `setarchitect` supplies a VERIFIED exact-head `independent-reviewer` approval, the required `GOVERDOCS Governance Gate` becomes non-blocking for the critical obligation, and GitHub accepts the exact-head merge server-side.

          The proof must not weaken the authority policy, ruleset, required check, exact-head semantics, revocation semantics, or anti-self-approval rule.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$proof"
          git commit -m 'test(governance): prove R11 positive live quorum'
          git push origin "HEAD:refs/heads/$branch"

          head_sha="$(git rev-parse HEAD)"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title 'test(governance): prove R11 positive live quorum' \
            --body "## Purpose

Final OATHDO R11 positive live quorum acceptance probe for #35.

## Exact subject

- head: \`$head_sha\`
- author must remain the neutral GitHub Actions actor
- critical event: \`governance_change\`

## Required authority

- \`nulleimy\` → \`project-owner\` exact-head approval
- \`setarchitect\` → \`independent-reviewer\` exact-head approval
- both must be distinct non-author actors

@setarchitect: submit the exact independent-reviewer marker supplied by the project owner. Do not alter the PR head.

## Acceptance

1. R10 exact-subject verification accepts both current-head markers.
2. R11 observes two distinct eligible actors and two distinct roles.
3. Required critical capabilities are satisfied.
4. \`GOVERDOCS Governance Gate\` becomes non-blocking for the critical obligation.
5. GitHub accepts exact-head merge server-side.
6. No ruleset or policy weakening occurs.

Tracks #35."

          echo "R11_PROOF_HEAD=$head_sha"

  release-v0-1-0:
    name: release / v0.1.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [governance-toolchain, package]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate fixed release version
        run: grep -Fx 'version = "0.1.0"' pyproject.toml

      - name: Create one-time GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; no mutation performed."
            exit 0
          fi
          gh release create v0.1.0 \
            --target "$GITHUB_SHA" \
            --title "GOVERDOCS v0.1.0" \
            --notes "First governed GOVERDOCS release: deterministic Gate, evidence/approval trust boundary, GitHub evidence + ChangeSet sources, Check publication, and PR governance composition runner."
